# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# Quality Assurance — Quality Gate: lint, rtunk and commit messages
# =============================================================================
# Validates every pull request, merge-queue entry and push to the default branch:
# repository-specific linters (ci:lint, optional), rtunk, and the commit convention.
# Requires the mise task: ci:commitlint (ci:lint is optional).
#
# Jobs:
#   qa — lint (ci:lint), rtunk and commit messages, from core.qa
#
# MANAGED BY TERRAFORM (axnic/.github, terraform/modules/workflows) — do not edit by hand.
# Reusable workflow: https://github.com/axnic/.github/blob/main/.github/workflows/core.qa.yaml
# =============================================================================

name: Quality Assurance

on:
  merge_group: {}
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # qa — lint (ci:lint), rtunk and commit messages, from core.qa
  # ---------------------------------------------------------------------------
  qa:
    name: ✅ Checks
    # Pinned to the axnic/.github commit that last changed this workflow; Terraform keeps it up to date.
    uses: axnic/.github/.github/workflows/core.qa.yaml@2f6f94e93ed364f083e8e8b8611cde77280d100a # main
    secrets: inherit
    permissions:
      contents: read
