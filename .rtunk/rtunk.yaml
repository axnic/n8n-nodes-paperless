---
# Configuration of rtunk for this repository: the linters and plugin sources
# that `rtunk check` and `rtunk fmt` use here (`mise run lint`). rtunk reads the
# trunk.yaml format. ESLint is not part of it: it runs through
# `mise run ci:lint`, with the n8n community-package rules.
version: "0.1"
plugins:
  sources:
    - id: trunk
      uri: https://github.com/trunk-io/plugins
      ref: v1.11.0
lint:
  enabled:
    - git-diff-check
    - markdownlint
    - prettier
    - trufflehog
    - yamllint
  ignore:
    - linters: [ALL]
      paths:
        - pnpm-lock.yaml  # generated by pnpm
    - linters: [markdownlint]
      paths:
        - LICENSE.md  # license text, no heading
actions:
  enabled:
    - commitlint
  disabled: []
